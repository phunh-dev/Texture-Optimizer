[package]
name = "texture-optimizer"
version = "0.1.0"
description = "Texture Optimizer desktop app"
authors = ["PhuNH"]
license = ""
repository = ""
edition.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "texture_optimizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-store = "2.5.0"
texopt-core.workspace = true
image.workspace = true
rayon.workspace = true
percent-encoding = "2"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
